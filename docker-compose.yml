services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: polizas
      POSTGRES_USER: polizas
      POSTGRES_PASSWORD: polizas
    # El 5434 del host evita chocar con un PostgreSQL instalado localmente.
    # Dentro de la red de Compose el puerto sigue siendo el 5432.
    ports:
      - "5434:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U polizas -d polizas" ]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
