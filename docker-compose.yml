services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: polizas
      POSTGRES_USER: polizas
      POSTGRES_PASSWORD: polizas
    # El 5434 del host evita chocar con un PostgreSQL instalado localmente.
    # Dentro de la red de Compose el puerto sigue siendo el 5432.
    ports:
      - "5434:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U polizas -d polizas" ]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      # Dentro de la red de Compose la BD es db:5432; el 5434 del host es solo
      # para acceso externo (psql, un cliente grafico).
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/polizas
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
